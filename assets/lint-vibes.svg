<svg xmlns="http://www.w3.org/2000/svg" width="1357" height="1034" viewBox="0 0 1357 1034" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,monospace" font-size="13.5" role="img">
<title>skillsmith lint</title>
<rect width="1357" height="1034" rx="10" fill="#0d1117" stroke="#30363d"/>
<path d="M0 10a10 10 0 0 1 10-10h1337a10 10 0 0 1 10 10v26H0z" fill="#161b22"/>
<line x1="0" y1="36" x2="1357" y2="36" stroke="#30363d"/>
<circle cx="20" cy="18" r="5.5" fill="#ff5f57"/>
<circle cx="39" cy="18" r="5.5" fill="#febc2e"/>
<circle cx="58" cy="18" r="5.5" fill="#28c840"/>
<text x="678.5" y="22.5" text-anchor="middle" fill="#8b949e" font-size="12">skillsmith lint</text>
<text y="65.5" textLength="259.20" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">$ skillsmith lint examples/vibes</tspan></text>
<text y="104.7" textLength="680.40" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">  </tspan><tspan fill="#bc8cff" font-weight="600">skillsmith lint</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#6e7681">C:\Users\malik\New folder (12)\skillsmith\examples\vibes\SKILL.md</tspan></text>
<text y="143.8" textLength="283.50" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">  </tspan><tspan fill="#ff7b72">ERROR</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#c9d1d9" font-weight="600">frontmatter-description</tspan><tspan fill="#6e7681"> :1</tspan></text>
<text y="163.4" textLength="518.40" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">         description is 28 chars; that is a label, not a trigger</tspan></text>
<text y="182.9" textLength="915.30" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">         </tspan><tspan fill="#39c5cf">fix</tspan><tspan fill="#c9d1d9"> Describe the situations that should load it: tasks, user phrases, file types. Aim for 200-600 chars.</tspan></text>
<text y="222.1" textLength="283.50" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">  </tspan><tspan fill="#ff7b72">ERROR</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#c9d1d9" font-weight="600">frontmatter-description</tspan><tspan fill="#6e7681"> :1</tspan></text>
<text y="241.7" textLength="429.30" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">         description never says WHEN to use the skill</tspan></text>
<text y="261.3" textLength="874.80" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">         </tspan><tspan fill="#39c5cf">fix</tspan><tspan fill="#c9d1d9"> Add explicit trigger conditions: &quot;Use when the user asks to…&quot;, &quot;Use whenever a task involves…&quot;.</tspan></text>
<text y="300.4" textLength="210.60" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">  </tspan><tspan fill="#ff7b72">ERROR</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#c9d1d9" font-weight="600">ordered-procedure</tspan></text>
<text y="320.0" textLength="631.80" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">         body has 0 numbered step(s); a working skill has an ordered procedure</tspan></text>
<text y="339.6" textLength="1158.30" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">         </tspan><tspan fill="#39c5cf">fix</tspan><tspan fill="#c9d1d9"> Write the behaviour as a numbered list the agent walks every time: &quot;1. … 2. … 3. …&quot;. At least three steps, each a concrete action.</tspan></text>
<text y="378.7" textLength="210.60" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">  </tspan><tspan fill="#d29922">WARN </tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#c9d1d9" font-weight="600">negative-scope</tspan><tspan fill="#6e7681"> :1</tspan></text>
<text y="398.3" textLength="413.10" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">         No statement of when NOT to use this skill</tspan></text>
<text y="417.8" textLength="818.10" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">         </tspan><tspan fill="#39c5cf">fix</tspan><tspan fill="#c9d1d9"> Add &quot;Do NOT use for…&quot; to the description, naming the nearby tasks it should stay out of.</tspan></text>
<text y="457.0" textLength="162.00" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">  </tspan><tspan fill="#d29922">WARN </tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#c9d1d9" font-weight="600">persistence</tspan></text>
<text y="476.6" textLength="421.20" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">         Behavioural skill has no persistence clause</tspan></text>
<text y="496.1" textLength="1142.10" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">         </tspan><tspan fill="#39c5cf">fix</tspan><tspan fill="#c9d1d9"> State plainly: &quot;ACTIVE EVERY RESPONSE until the user says stop.&quot; If this is a one-shot skill, say &quot;one-shot&quot; in the description.</tspan></text>
<text y="535.3" textLength="153.90" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">  </tspan><tspan fill="#d29922">WARN </tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#c9d1d9" font-weight="600">off-switch</tspan></text>
<text y="554.9" textLength="178.20" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">         No off switch</tspan></text>
<text y="574.5" textLength="810.00" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">         </tspan><tspan fill="#39c5cf">fix</tspan><tspan fill="#c9d1d9"> Name the phrase that disables it, e.g. &quot;Off only when the user says \&quot;stop prove-it\&quot;.&quot;</tspan></text>
<text y="613.6" textLength="153.90" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">  </tspan><tspan fill="#d29922">WARN </tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#c9d1d9" font-weight="600">no-hedging</tspan></text>
<text y="633.2" textLength="575.10" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">         4 hedges (&quot;try to&quot;, &quot;consider&quot;, &quot;where possible&quot;, &quot;generally&quot;)</tspan></text>
<text y="652.8" textLength="947.70" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">         </tspan><tspan fill="#39c5cf">fix</tspan><tspan fill="#c9d1d9"> Make each rule unconditional, or delete it. &quot;Run the tests&quot; beats &quot;try to run the tests where possible&quot;.</tspan></text>
<text y="691.9" textLength="210.60" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">  </tspan><tspan fill="#d29922">WARN </tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#c9d1d9" font-weight="600">no-adjective-soup</tspan></text>
<text y="711.5" textLength="737.10" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">         5 content-free quality words (&quot;high-quality&quot;, &quot;robust&quot;, &quot;clean&quot;, &quot;best practices&quot;)</tspan></text>
<text y="731.0" textLength="939.60" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">         </tspan><tspan fill="#39c5cf">fix</tspan><tspan fill="#c9d1d9"> Replace each with the concrete behaviour you mean. &quot;Robust&quot; → &quot;handle the empty-input case and say so&quot;.</tspan></text>
<text y="770.2" textLength="202.50" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">  </tspan><tspan fill="#d29922">WARN </tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#c9d1d9" font-weight="600">concrete-example</tspan></text>
<text y="789.8" textLength="364.50" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">         No concrete example of the behaviour</tspan></text>
<text y="809.4" textLength="761.40" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">         </tspan><tspan fill="#39c5cf">fix</tspan><tspan fill="#c9d1d9"> Add at least one &quot;instead of X, do Y&quot; pair, or a short fenced before/after block.</tspan></text>
<text y="848.5" textLength="153.90" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">  </tspan><tspan fill="#6e7681">info </tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#c9d1d9" font-weight="600">measurable</tspan></text>
<text y="868.1" textLength="558.90" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">         Nothing in the skill says what observable change it produces</tspan></text>
<text y="887.6" textLength="1312.20" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">         </tspan><tspan fill="#39c5cf">fix</tspan><tspan fill="#c9d1d9"> Add one line naming the measurable effect: fewer tool calls, shorter replies, tests run before &quot;done&quot;, etc. The eval harness checks for exactly this.</tspan></text>
<text y="926.8" textLength="210.60" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">  </tspan><tspan fill="#6e7681">info </tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#c9d1d9" font-weight="600">no-self-reference</tspan></text>
<text y="946.4" textLength="672.30" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">         1 line(s) describing the skill to a human instead of instructing the agent</tspan></text>
<text y="965.9" textLength="550.80" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">         </tspan><tspan fill="#39c5cf">fix</tspan><tspan fill="#c9d1d9"> Write in the imperative, to the agent: &quot;Do X. Never Y.&quot;</tspan></text>
<text y="1005.1" textLength="356.40" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">  score </tspan><tspan fill="#ff7b72" font-weight="600">0</tspan><tspan fill="#6e7681">/100</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#6e7681">errors 25, warnings 8, info 3</tspan></text>
</svg>
