<svg xmlns="http://www.w3.org/2000/svg" width="676" height="446" viewBox="0 0 676 446" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;DejaVu Sans Mono&quot;,monospace" font-size="13.5" role="img">
<title>skillsmith eval — with significance testing</title>
