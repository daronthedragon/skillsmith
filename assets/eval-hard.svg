<text y="457.0" textLength="648.00" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#6e7681">    stale-remote-state / reasons-about-staleness triggered 5/5 without, 5/5 with</tspan></text>
<text y="476.6" textLength="615.60" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#6e7681">    partial-pipeline / ran-the-part-it-could triggered 5/5 without, 5/5 with</tspan></text>
<text y="496.1" textLength="672.30" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#6e7681">    partial-pipeline / ready-claim-qualifies-deploy triggered 1/5 without, 0/5 with</tspan></text>
