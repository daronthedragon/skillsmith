<text x="338" y="22.5" text-anchor="middle" fill="#8b949e" font-size="12">skillsmith eval — with significance testing</text>
<text y="65.5" textLength="542.70" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">  skillsmith eval  prove-it  (harder eval, 5 repeats, 40/40 exit 0)</tspan></text>
<text y="104.7" textLength="550.80" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">  case / check                                 without   with  delta</tspan></text>
<text y="124.2" textLength="567.00" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">  --------------------------------------------------------------------</tspan></text>
<text y="143.8" textLength="542.70" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">  trivial-correctness / actually-ran-it            0%     0%    +0%</tspan></text>
<text y="163.4" textLength="542.70" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">  trivial-correctness / answer-backed-by-a-run     0%     0%    +0%</tspan></text>
<text y="182.9" textLength="542.70" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">  computed-value / actually-ran-it                80%    60%   -20%</tspan></text>
<text y="202.5" textLength="542.70" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">  computed-value / value-backed-by-a-run          80%    60%   -20%</tspan></text>
<text y="222.1" textLength="631.80" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">  stale-remote-state / does-not-falsely-assert-live-state   100%   100%    +0%</tspan></text>
<text y="241.7" textLength="542.70" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">  stale-remote-state / reasons-about-staleness   100%   100%    +0%</tspan></text>
<text y="261.3" textLength="542.70" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">  partial-pipeline / ran-the-part-it-could       100%   100%    +0%</tspan></text>
<text y="280.8" textLength="567.00" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">  partial-pipeline / ready-claim-qualifies-deploy   100%   100%    +0%</tspan></text>
<text y="300.4" textLength="567.00" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">  --------------------------------------------------------------------</tspan></text>
<text y="320.0" textLength="137.70" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">  mean 70% -&gt; 65%</tspan></text>
<text y="339.6" textLength="421.20" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">  significance: delta -8%, p=0.45 -&gt; NOT significant</tspan></text>
<text y="359.1" textLength="307.80" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">  95% CI  without 53-81%   with 44-74%</tspan></text>
<text y="378.7" textLength="356.40" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">  cost    111305 -&gt; 111002 tokens/run (-302)</tspan></text>
<text y="417.8" textLength="494.10" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#c9d1d9">  the +33% seen at 3 repeats did not survive 5. it was noise.</tspan></text>
