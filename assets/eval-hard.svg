<text y="594.0" textLength="518.40" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#6e7681">  cost    78,008 → 77,802 tokens/run median (-206 for the skill)</tspan></text>
<text y="633.2" textLength="388.80" lengthAdjust="spacing" xml:space="preserve"><tspan x="22" fill="#6e7681">  40 runs. Transcripts are in the --json output.</tspan></text>
